name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # No `cache: gradle` here: gradle/actions/setup-gradle below owns Gradle
          # caching. If setup-java pre-populates ~/.gradle first, setup-gradle skips
          # its own caching entirely ("a pre-existing Gradle User Home was found").

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # The wrapper's own bootstrap fetches the distribution from services.gradle.org,
      # which redirects to GitHub release downloads and intermittently stalls or answers
      # 504. Cache the unpacked distribution under a key derived from the wrapper itself
      # (so it survives setup-gradle upgrades, which key their cache separately), and
      # retry the bootstrap so one bad CDN response does not fail the job.
      - name: Cache Gradle distribution
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-dist-

      - name: Prime Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if bash ./gradlew --version >/dev/null 2>&1; then
              echo "Gradle distribution ready (attempt $attempt)"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not fetch the Gradle distribution after 3 attempts."
          exit 1

      # warningsAsErrors is on, so any lint warning in either variant fails the job
      # before anything is built. --warning-mode=fail also fails on Gradle deprecations.
      - name: Run Lint
        run: ./gradlew lintDebug lintRelease --warning-mode=fail

      # One Gradle invocation for both, so configuration runs once. The bundle is
      # unsigned here (no signing secrets on PRs); it validates R8 and resource
      # shrinking on every change, i.e. the same build the release ships.
      - name: Run Unit Tests & Build Release Bundle
        run: ./gradlew testDebugUnitTest bundleRelease --warning-mode=fail

      # Room's KSP step rewrites app/schemas on every build. A diff here means a schema
      # change was made without committing its exported JSON (needed for migrations).
      - name: Check Room Schemas Are Committed
        run: |
          git add -N app/schemas
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::Room schema JSON in app/schemas is out of date; build locally and commit it."
            exit 1
          fi

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.*
          retention-days: 7

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Publish Test Report Summary
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always()
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/*.xml'
          check_name: "Unit Test Results"
