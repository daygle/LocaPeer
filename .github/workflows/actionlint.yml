name: Workflow Lint

# Checks the workflow files themselves (syntax, expressions, action inputs, and the
# shell in `run:` blocks via shellcheck), so a broken release workflow is caught on
# the PR that breaks it rather than on the next tag.
on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The image bundles shellcheck, so `run:` scripts are checked too.
      # Pinned by digest so a re-pushed tag can't change what runs. When bumping the
      # version, update the digest as well (docker buildx imagetools inspect <image:tag>).
      - name: Check Workflow Files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
