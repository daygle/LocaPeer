name: Android Release

# Builds the signed release APK on GitHub instead of via Android Studio's
# "Generate Signed Build/APK" wizard. The keystore is the same one, supplied through
# repository secrets, so the resulting APK keeps its existing signature and can update
# installations in place.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # No `cache: gradle` here: gradle/actions/setup-gradle below owns Gradle caching.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # The keystore is stored base64-encoded in a repository secret and decoded to a
      # throwaway path on the runner, so it never lands in the workspace or an artifact.
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set (see README, 'Signing for CI')."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/locapeer-release.jks"
          chmod 600 "$RUNNER_TEMP/locapeer-release.jks"

      - name: Build Signed Release APK
        env:
          LOCAPEER_KEYSTORE_FILE: ${{ runner.temp }}/locapeer-release.jks
          LOCAPEER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LOCAPEER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOCAPEER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # On a tag (v1.1.46) pin versionName to the tag so the APK can't drift from the release.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew assembleRelease -PappVersionName="${GITHUB_REF_NAME#v}"
          else
            ./gradlew assembleRelease
          fi

      # Fail loudly rather than shipping an unsigned or unexpectedly-signed APK.
      - name: Verify APK Signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK at $APK. Contents:"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocaPeer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$APK"
          fi
