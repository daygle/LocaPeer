name: Android Release

# Builds the signed release APK on GitHub instead of via Android Studio's
# "Generate Signed Build/APK" wizard. The keystore is the same one, supplied through
# repository secrets, so the resulting APK keeps its existing signature and can update
# installations in place.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # No `cache: gradle` here: gradle/actions/setup-gradle below owns Gradle caching.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # The keystore is stored base64-encoded in a repository secret and decoded to a
      # throwaway path on the runner, so it never lands in the workspace or an artifact.
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set (see README, 'Signed release APK & AAB')."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/locapeer-release.jks"
          chmod 600 "$RUNNER_TEMP/locapeer-release.jks"

      - name: Build Signed Release APK & AAB
        env:
          LOCAPEER_KEYSTORE_FILE: ${{ runner.temp }}/locapeer-release.jks
          LOCAPEER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LOCAPEER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOCAPEER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # On a tag, derive both versions from it so a release needs no manual edits:
          # v1.1.46 -> versionName 1.1.46, versionCode 10146 (major*10000 + minor*100 + patch).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH."
              exit 1
            fi
            MAJOR=$((10#${BASH_REMATCH[1]}))
            MINOR=$((10#${BASH_REMATCH[2]}))
            PATCH=$((10#${BASH_REMATCH[3]}))
            # Two digits each for minor and patch keep codes strictly increasing across releases.
            if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
              echo "::error::Minor and patch must be 0-99 for the versionCode scheme (got $VERSION)."
              exit 1
            fi
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "versionName=$VERSION versionCode=$VERSION_CODE"
            ./gradlew assembleRelease bundleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
          else
            ./gradlew assembleRelease bundleRelease
          fi

      # Fail loudly rather than shipping an unsigned or unexpectedly-signed APK.
      - name: Verify APK Signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK at $APK. Contents:"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      # The AAB is what Google Play takes; it is signed with the same key (Play uses it as
      # the upload key). apksigner can't read bundles, so check it with jarsigner.
      - name: Verify AAB Signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::No signed AAB at $AAB. Contents:"
            ls -l app/build/outputs/bundle/release/ || true
            exit 1
          fi
          OUT=$(jarsigner -verify -certs "$AAB")
          echo "$OUT" | tail -n 5
          if ! echo "$OUT" | grep -q "jar verified"; then
            echo "::error::AAB at $AAB is not signed."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocaPeer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Upload the AAB to Play Console; mapping.txt lets Play deobfuscate R8-shrunk crash traces.
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocaPeer-release-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$AAB" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$APK" "$AAB"
          fi
