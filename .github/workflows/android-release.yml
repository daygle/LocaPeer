name: Android Release

# Builds the signed release App Bundle (AAB) on GitHub instead of via Android Studio's
# "Generate Signed Bundle" wizard. The keystore is the same one, supplied through
# repository secrets, so Play keeps recognising it as the upload key.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Lint & Build Signed Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # No `cache: gradle` here: gradle/actions/setup-gradle below owns Gradle caching.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # Invoking the script through `bash` would hide a missing executable bit until the
      # build step. Check it up front with an actionable message instead, and run the
      # wrapper the way the build does.
      - name: Check Gradlew Is Executable
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root."
            exit 1
          fi
          if [ ! -x gradlew ]; then
            echo "::error::gradlew is not executable, so the release build cannot start."
            echo "The mode bit is stored in git; restore and commit it with:"
            echo "  chmod +x gradlew && git update-index --chmod=+x gradlew"
            exit 1
          fi

      # Same wrapper-download hazard as the CI workflow: the distribution comes from
      # services.gradle.org via a GitHub release redirect that intermittently stalls.
      # Cache the unpacked distribution under a key derived from the wrapper, and retry
      # the bootstrap so a release build does not fail on one bad CDN response.
      - name: Cache Gradle distribution
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-dist-

      - name: Prime Gradle distribution
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "Gradle distribution ready (attempt $attempt)"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not fetch the Gradle distribution after 3 attempts."
          exit 1

      # Lint gates the release: warningsAsErrors is on, so any lint warning stops the
      # workflow here, before the keystore is touched or anything is published.
      - name: Run Lint
        run: ./gradlew lintRelease --warning-mode=fail

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --warning-mode=fail

      # The keystore is stored base64-encoded in a repository secret and decoded to a
      # throwaway path on the runner, so it never lands in the workspace or an artifact.
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set (see README, 'Signed release AAB')."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/locapeer-release.jks"
          chmod 600 "$RUNNER_TEMP/locapeer-release.jks"

      - name: Build Signed Release AAB
        env:
          LOCAPEER_KEYSTORE_FILE: ${{ runner.temp }}/locapeer-release.jks
          LOCAPEER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LOCAPEER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOCAPEER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # On a tag, derive both versions from it so a release needs no manual edits:
          # v1.1.46 -> versionName 1.1.46, versionCode 10146 (major*10000 + minor*100 + patch).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH."
              exit 1
            fi
            MAJOR=$((10#${BASH_REMATCH[1]}))
            MINOR=$((10#${BASH_REMATCH[2]}))
            PATCH=$((10#${BASH_REMATCH[3]}))
            # Two digits each for minor and patch keep codes strictly increasing across releases.
            if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
              echo "::error::Minor and patch must be 0-99 for the versionCode scheme (got $VERSION)."
              exit 1
            fi
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "versionName=$VERSION versionCode=$VERSION_CODE"
            ./gradlew bundleRelease --warning-mode=fail -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
            echo "AAB_NAME=LocaPeer-$VERSION.aab" >> "$GITHUB_ENV"
          else
            ./gradlew bundleRelease --warning-mode=fail
            echo "AAB_NAME=LocaPeer-${GITHUB_SHA::7}.aab" >> "$GITHUB_ENV"
          fi

      # The AAB is what Google Play takes; it is signed with the same key (Play uses it as
      # the upload key). apksigner can't read bundles, so check it with jarsigner.
      - name: Verify AAB Signature & Name It After the Version
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::No signed AAB at $AAB. Contents:"
            ls -l app/build/outputs/bundle/release/ || true
            exit 1
          fi
          OUT=$(jarsigner -verify -certs "$AAB")
          echo "$OUT" | tail -n 5
          if ! echo "$OUT" | grep -q "jar verified"; then
            echo "::error::AAB at $AAB is not signed."
            exit 1
          fi
          mv "$AAB" "app/build/outputs/bundle/release/$AAB_NAME"

      # archive: false uploads the .aab as-is (a single file, not wrapped in a zip);
      # the artifact takes the file's name.
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/${{ env.AAB_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      # mapping.txt lets Play Console deobfuscate R8-shrunk crash traces.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v7
        with:
          name: LocaPeer-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=app/build/outputs/bundle/release/$AAB_NAME
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$AAB" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$AAB"
          fi
