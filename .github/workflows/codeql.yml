name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 18 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Use latest tools to pick up the newest Kotlin support as soon as it ships.
        tools: latest
        # manual build mode is required for Android
        build-mode: manual

    - name: Build project
      run: |
        chmod +x gradlew
        # CodeQL's Kotlin extractor hard-rejects Kotlin >= 2.4.20 at compile time
        # (KotlinVersionTooRecentError); there is no supported env var or system
        # property to skip that check. Keep the app on the latest Kotlin for normal
        # builds, but compile here with the newest CodeQL-supported release (2.4.10)
        # so the scan produces a database.
        ./gradlew clean assembleDebug --no-daemon -PkotlinVersion=2.4.10

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
