name: "CodeQL"

# Not run on pull requests: CodeQL needs a full uncached compile, which makes it by far
# the slowest job. Every merge to main is still scanned, plus a weekly scheduled run.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        # No `cache: gradle` here: gradle/actions/setup-gradle below owns Gradle
        # caching. If setup-java pre-populates ~/.gradle first, setup-gradle skips
        # its own caching entirely.

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    # Same wrapper-download hazard as the other workflows: services.gradle.org redirects
    # to GitHub release downloads, which intermittently stalls or answers 504. Cache the
    # unpacked distribution under a wrapper-derived key and retry the bootstrap, so a
    # scan does not fail on one bad CDN response.
    - name: Cache Gradle distribution
      uses: actions/cache@v6
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-dist-

    - name: Prime Gradle distribution
      run: |
        for attempt in 1 2 3; do
          if ./gradlew --version >/dev/null 2>&1; then
            echo "Gradle distribution ready (attempt $attempt)"
            exit 0
          fi
          sleep $((attempt * 10))
        done
        echo "::error::Could not fetch the Gradle distribution after 3 attempts."
        exit 1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Use latest tools to pick up the newest Kotlin support as soon as it ships.
        tools: latest
        # manual build mode is required for Android
        build-mode: manual

    - name: Build project
      run: |
        # CodeQL's Kotlin extractor hard-rejects Kotlin >= 2.4.20 at compile time
        # (KotlinVersionTooRecentError); there is no supported env var or system
        # property to skip that check. Keep the app on the latest Kotlin for normal
        # builds, but compile here with the newest CodeQL-supported release (2.4.10)
        # so the scan produces a database.
        #
        # --no-build-cache is required: setup-gradle caches the Gradle *build* cache
        # (org.gradle.caching=true), so on a scheduled rerun of the same commit every
        # compile task resolves FROM-CACHE and kotlinc/javac never actually execute.
        # CodeQL observes the compiler to build its database, sees no invocations, and
        # finalize fails with "didn't build any of it". Compilation must be real.
        ./gradlew clean assembleDebug --no-daemon --no-build-cache -PkotlinVersion=2.4.10

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
