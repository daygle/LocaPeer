name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 18 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    env:
      # Bypass strict version check for Kotlin 2.4.20-RC which is too new for the current extractor
      # We use all known variants and as system properties to ensure the extractor picks them up
      CODEQL_EXTRACTOR_KOTLIN_OPTION_SKIP_VERSION_CHECK: true
      CODEQL_EXTRACTOR_JAVA_KOTLIN_SKIP_VERSION_CHECK: true
      CODEQL_EXTRACTOR_JAVA_SKIP_KOTLIN_VERSION_CHECK: true
      CODEQL_SKIP_KOTLIN_VERSION_CHECK: true
      CODEQL_EXTRACTOR_JAVA_KOTLIN_VERSION_TOO_RECENT_IS_ERROR: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Use latest tools to pick up support for Kotlin 2.4.20-RC
        tools: latest
        # manual build mode is required for Android
        build-mode: manual

    - name: Build project
      env:
        # Re-assert bypass variables at the step level for the Gradle runner
        CODEQL_EXTRACTOR_KOTLIN_OPTION_SKIP_VERSION_CHECK: true
        CODEQL_EXTRACTOR_JAVA_KOTLIN_SKIP_VERSION_CHECK: true
        CODEQL_EXTRACTOR_JAVA_SKIP_KOTLIN_VERSION_CHECK: true
        CODEQL_SKIP_KOTLIN_VERSION_CHECK: true
        CODEQL_EXTRACTOR_JAVA_KOTLIN_VERSION_TOO_RECENT_IS_ERROR: false
      run: |
        chmod +x gradlew
        # Force a full clean build to ensure CodeQL sees all source files.
        # We also pass the flags as system properties to the JVM in case the tracer checks them there.
        ./gradlew clean assembleDebug --no-daemon \
          -DCODEQL_EXTRACTOR_JAVA_KOTLIN_SKIP_VERSION_CHECK=true \
          -DCODEQL_EXTRACTOR_KOTLIN_OPTION_SKIP_VERSION_CHECK=true \
          -DCODEQL_EXTRACTOR_JAVA_KOTLIN_VERSION_TOO_RECENT_IS_ERROR=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
