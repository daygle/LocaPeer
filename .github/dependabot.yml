# Dependabot version updates for the LocaPeer Android project.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options
version: 2

updates:
  # -----------------------------------------------------------------------------------------
  # Gradle ecosystem: AGP + Kotlin toolchain plugins + all app dependencies.
  # -----------------------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: main
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "gradle"
    
    # Standardizes commit messages for a cleaner git history
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

    versioning-strategy: increase
    
    groups:
      # Kotlin compiler, KSP, and kotlinx libs co-evolve.
      kotlin-stack:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"

      # Android Gradle Plugin and Android tools
      android-tools-build:
        patterns:
          - "com.android*"

      # Jetpack Compose specific group (often uses a single BOM bump)
      compose:
        patterns:
          - "androidx.compose*"

      # General AndroidX libraries excluding Compose and Tests
      androidx:
        patterns:
          - "androidx*"
        exclude-patterns:
          - "androidx.test*"
          - "androidx.compose*"

      # Google components: Material, Play Services, Hilt, Accompanist
      google-stack:
        patterns:
          - "com.google.android.material*"
          - "com.google.android.gms*"
          - "com.google.dagger*"
          - "com.google.accompanist*"

      # Security & Networking third-party libs
      third-party:
        patterns:
          - "org.bouncycastle*"
          - "fr.acinq.secp256k1*"
          - "com.squareup.okhttp3*"
          - "com.google.zxing*"
          - "com.journeyapps*"
          - "org.osmdroid*"

      # Test-only dependencies
      tests:
        patterns:
          - "junit*"
          - "org.mockito*"
          - "androidx.test*"

  # -----------------------------------------------------------------------------------------
  # GitHub Actions ecosystem: keep CI actions fresh
  # -----------------------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-ci):"
