# Dependabot version updates for the LocaPeer Android project.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options
version: 2

# Project pins everything inline in app/build.gradle.kts (no gradle/libs.versions.toml),
# so a single "/" directory covers both the root project (plugins) and the :app module.

updates:
  # -----------------------------------------------------------------------------------------
  # Gradle ecosystem: AGP + Kotlin toolchain plugins + all app dependencies.
  # -----------------------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: main
    # Limit is shared across all groups, not per group. 10 leaves headroom so a slow-to-merge
    # group doesn't queue an unrelated security fix behind it.
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "gradle"
    # Cap unrelated bumps so a stale lib doesn't gate an urgent security fix.
    versioning-strategy: increase
    # `directory: "/"` lets the gradle ecosystem find every build.gradle* across the project
    # AND auto-tracks gradle-wrapper.properties (no separate wrapper entry needed).
    groups:
      # Kotlin compiler, KSP, kotlinx libs all co-evolve. Keep these in one
      # PR so a Kotlin bump can land alongside the matching KSP/serialization update.
      kotlin-stack:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"

      # Android Gradle Plugin (`id("com.android.application")`) and any future
      # com.android.* tooling plugin declared in a root build.gradle.kts.
      android-tools-build:
        patterns:
          - "com.android*"

      # Single PR for everything androidx.* (Compose, Lifecycle, Navigation, Room,
      # WorkManager, DataStore, Hilt-Navigation, Biometric, Camera, AppCompat, ...).
      androidx:
        patterns:
          - "androidx*"
        exclude-patterns:
          - "androidx.test*"

      # Google components: Hilt/Dagger compiler, Material, Play Services Location, Accompanist.
      google-stack:
        patterns:
          - "com.google.android.material*"
          - "com.google.android.gms*"
          - "com.google.dagger*"
          - "com.google.accompanist*"

      # Third-party JVM/security/network: most touch NIP-44 crypto, WebSocket relay
      # transport, or QR/Map rendering, so reviewers benefit from seeing them together.
      third-party:
        patterns:
          - "org.bouncycastle*"
          - "fr.acinq.secp256k1*"
          - "com.squareup.okhttp3*"
          - "com.google.zxing*"
          - "com.journeyapps*"
          - "org.osmdroid*"

      # JVM unit + instrumentation tests stay in their own group so test-only bumps
      # don't queue behind application dependency churn.
      tests:
        patterns:
          - "junit*"
          - "org.mockito*"
          - "androidx.test*"

  # -----------------------------------------------------------------------------------------
  # GitHub Actions ecosystem: keep CI actions fresh (security advisories land here too).
  # -----------------------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: main
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
