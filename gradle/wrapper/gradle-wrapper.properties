distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
# The distribution redirects to GitHub release downloads, which intermittently answers
# 504 or stalls. Ten seconds with no retry turns that into a failed build on a fresh
# checkout; be patient and retry instead.
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
