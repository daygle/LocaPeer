distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.2-bin.zip
# Verified on download, like the SHA-pinned CI actions; update it with the URL
# (published next to each distribution as <zip>.sha256).
distributionSha256Sum=971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b
# The distribution redirects to GitHub release downloads, which intermittently answers
# 504 or stalls. Ten seconds with no retry turns that into a failed build on a fresh
# checkout; be patient and retry instead.
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
